name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI builds lean; they are never shipped.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Frontend checks. Platform-independent, so one runner is enough — the Rust
  # job below is the one that has to prove NFR-012 portability.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Fixture corpus self-check
        run: node tests/fixtures/tools/self-check.mjs

      - name: Vite build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Rust checks on all three target platforms (NFR-012: macOS 12+, Windows 10+,
  # Ubuntu 22.04+). fmt and clippy only need to run once; the per-OS matrix is
  # there to prove the crate compiles and its tests pass everywhere.
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            lint: true
          - os: macos-latest
            lint: false
          - os: windows-latest
            lint: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build reads ../dist during compilation, so the frontend must exist first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: cargo fmt --check
        if: matrix.lint
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        if: matrix.lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # NFR-001 / NFR-002 / NFR-004 — the machine-checkable performance halves (T-012).
      # The 2000-leaf fixture is gitignored, so regenerate it first; the benchmarks assert
      # the plan's budgets (800 ms parse+index, 5 ms node-detail, 400 MB RSS) INSIDE their
      # bodies, so a regression panics and fails the build — no separate threshold tooling.
      - name: NFR-001/002/004 collection benches
        if: matrix.lint
        working-directory: src-tauri
        run: |
          node ../tests/fixtures/tools/generate-large.mjs --seed 0 --leaves 2000
          cargo bench --bench collection

      # TC-U-003 / TC-U-004 live here: the capability set and the CSP are security
      # surface, and widening either must fail the build rather than ship.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features

      # NFR-015 — src/bindings.ts is generated from the command signatures and must never
      # drift from them. Regenerate (the test is #[ignore]d so the plain `cargo test`
      # above skips it), then fail if it rewrote the committed file.
      - name: NFR-015 bindings drift check
        if: matrix.lint
        working-directory: src-tauri
        run: |
          cargo test --all-features regenerate_bindings -- --ignored
          git diff --exit-code -- ../src/bindings.ts
